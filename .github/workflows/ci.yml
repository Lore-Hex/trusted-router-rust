name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv
      - run: cargo check --workspace --all-features --locked

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package -p trusted-router --locked
      - name: The published archive carries no keys or private fixtures
        run: |
          set -euo pipefail
          # RELEASING.md requires this; crates.io uploads are immutable, so it
          # has to hold before the upload, not after. The listing is captured in
          # its own command so that a cargo failure fails this step: an empty
          # list would otherwise satisfy the grep and read as an all-clear.
          cargo package -p trusted-router --locked --list > /tmp/pkg-list.txt
          test -s /tmp/pkg-list.txt
          if grep -nEi '\.(pem|key|p12|pfx|jks)$|(^|/)(secrets?|credentials?)(/|$)' /tmp/pkg-list.txt; then
            echo '::error::the packaged crate would ship the files listed above'
            exit 1
          fi
      - name: The packaged licence matches the workspace licence
        run: cmp crates/trusted-router/LICENSE LICENSE
      - run: cargo build --release -p trusted-router-ffi
      - name: Validate C and C++ header
        run: |
          cc -std=c11 -Wall -Wextra -Werror -c examples/c/chat.c -I crates/trusted-router-ffi/include -o /tmp/chat.o
          c++ -std=c++17 -Wall -Wextra -Werror -x c++ -c examples/c/chat.c -I crates/trusted-router-ffi/include -o /tmp/chat-cpp.o

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
