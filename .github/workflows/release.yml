name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crates-io:
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish -p trusted-router --locked
      - name: Report missing registry credentials
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: echo '::notice::CARGO_REGISTRY_TOKEN is not configured; crates.io publication was skipped.'

  ffi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trusted-router-ffi-linux-x86_64
          - os: macos-latest
            artifact: trusted-router-ffi-macos-universal-source
          - os: windows-latest
            artifact: trusted-router-ffi-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p trusted-router-ffi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            target/release/*trusted_router_ffi*
            crates/trusted-router-ffi/include/trusted_router.h

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Package platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for artifact in artifacts/*; do
            name="$(basename "$artifact")"
            tar -C "$artifact" -czf "release/${name}.tar.gz" .
          done
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
