name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crates-io:
    # Publication happens on a version tag and nowhere else. workflow_dispatch
    # stays available for rebuilding the FFI artifacts, but must not be able to
    # push an immutable version to crates.io from an arbitrary branch.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Require registry credentials
        if: env.CARGO_REGISTRY_TOKEN == ''
        run: |
          echo '::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment. Failing rather than reporting a green release that published nothing.'
          exit 1
      - name: The tag matches the version being published
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="trusted-router"))')"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match crate version ${version}; refusing to publish an immutable version under the wrong name"
            exit 1
          fi
      - name: Publish crate
        run: cargo publish -p trusted-router --locked

  ffi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: trusted-router-ffi-linux-x86_64
          - os: macos-latest
            artifact: trusted-router-ffi-macos-universal-source
          - os: windows-latest
            artifact: trusted-router-ffi-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p trusted-router-ffi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          retention-days: 7
          path: |
            target/release/*trusted_router_ffi*
            crates/trusted-router-ffi/include/trusted_router.h

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: ffi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package platform archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          for artifact in artifacts/*; do
            name="$(basename "$artifact")"
            tar -C "$artifact" -czf "release/${name}.tar.gz" .
          done
          cd release
          sha256sum ./*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
