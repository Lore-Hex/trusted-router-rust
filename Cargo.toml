[workspace]
members = [
    "crates/trusted-router",
    "crates/trusted-router-ffi",
]
default-members = ["crates/trusted-router"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Lore-Hex/trusted-router-rust"
homepage = "https://trustedrouter.com"
authors = ["Lore Hex Corp <security@trustedrouter.com>"]

[workspace.dependencies]
async-stream = "0.3.6"
base64 = "0.22.1"
constant_time_eq = "0.3.1"
eventsource-stream = "0.2.3"
futures-core = "0.3.31"
futures-util = "0.3.31"
http = "1.3.1"
httpdate = "1.0.3"
jsonwebtoken = "9.3.1"
rand = "0.8.5"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
bytes = "1.10.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
# Keep the attestation dependency graph compatible with the declared Rust 1.88 MSRV.
simple_asn1 = "=0.6.3"
time = "=0.3.47"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4"] }
wiremock = "0.6.3"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
